{% extends "base.html" %}

{% block titulo %}Cômodos{% endblock %}

{% block conteudo %}
<h1>Cômodos</h1>

<form method="post" action="{{ url_for('rooms.criar') }}">
  <label for="nome">Nome do cômodo</label>
  <input id="nome" name="nome" maxlength="80" required>
  <button type="submit">Adicionar</button>
</form>

{% if comodos %}
<ul class="comodos">
  {% for comodo in comodos %}
  <li>
    <span>{{ comodo.nome }}</span>
    <form method="post" action="{{ url_for('rooms.remover', room_id=comodo.id) }}">
      <button type="submit">Remover</button>
    </form>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>Nenhum cômodo cadastrado ainda.</p>
{% endif %}
{% endblock %}
